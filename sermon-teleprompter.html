<script>
(function () {
  // 认识圣灵（四）：圣灵的工作（续）—— 一字不改，只分页
  var PAGES = [
    { title: "前言：真理的圣灵",
      body: ["上次我们讲到，圣灵还有一个名字，叫\"真理的圣灵\"。今天的经文是约翰福音14章26节：\"但保惠师，就是父因我的名所要差来的圣灵，祂要将一切的事指教你们，并且要叫你们想起我对你们所说的一切话。\"保惠师，就是蒙召到身旁帮助我们的那一位；祂指教我们，也提醒我们想起主的话。"] },
    { title: "引导——我们的教练",
      body: ["耶稣又说：\"只等真理的圣灵来了，祂要引导你们明白一切的真理。\"（约16:13）请注意\"引导\"这个词，原文是\"作向导、领路\"的意思，原文还有\"带进真理里面去\"的意思。走夜路需要向导，圣灵就是那位领路的。使徒行传8章，埃提阿伯太监读以赛亚书读不懂，说\"没有人指教我，怎能明白呢\"，用的就是同一个词。所以我们有了一位个人教练：就像运动教练在你身边亲自教你，怎样提高自己，关心指导你成长的每一步。", "祂会直接对我们说话，但祂最常用的方式，是通过圣经对我们说话。圣经是借着圣灵写出来的，是我们生命的根基。"] },
    { title: "属血气的人不能领会",
      body: ["\"就是真理的圣灵，乃世人不能接受的，因为不见祂，也不认识祂。\"（约14:17）世界只相信眼睛看得见的，圣灵看不见，世界就拒绝。但我们认识祂，因为祂住在我们里面。", "但要记得：\"属血气的人不领会神圣灵的事，反倒以为愚拙，并且不能知道，因为这些事唯有属灵的人才能看透。\"（林前2:14）\"属血气\"原文是\"属魂的、天然的人\"：天然的人只靠自己的思想、情感、意志来判断一切，所以看圣灵的事以为愚拙。\"看透\"原文是\"查验、审断\"：属灵的人能查验万事，因为圣灵在他里面。\"除了神的灵，也没有人知道神的事。\"（林前2:11）头脑上的知识，和神的真理有天渊之别。唯有圣灵，能带我们进入真理。"] },
    { title: "从问问题到回答问题",
      body: ["大家看四福音，门徒不断问问题：\"主啊，会不会是这样呢？主啊，究竟会怎样呢？\"可是五旬节以后，他们摇身一变，成了回答问题的人，满有权威地站起来回答众人。这就是有没有圣灵的分别。", "保罗说：\"神为爱祂的人所预备的，是眼睛未曾看见，耳朵未曾听见，人心也未曾想到的。\"（林前2:9）我们常常背到这里就停，但圣经没有停：\"只有神借着圣灵向我们显明了。\"（林前2:10）注意\"只有\"：没有圣灵，再聪明也没用；有了圣灵，奥秘就打开。"] },
    { title: "圣灵把话带进处境",
      body: ["我刚信主的时候，圣经里的难题一个一个冒出来，又一个一个被解答。还有一次，胰腺上有阴影，那个周三的祷告会，神给我一句话：\"这称为我名下的子民，若是自卑、祷告，寻求我的面，转离他们的恶行，我必从天上垂听，赦免他们的罪，医治他们的地。\"（代下7:14）圣灵就是这样，把神的话带进我们的处境里。", "有人劝还没信主的人，就像隔着门，看不明白里面的事；当你进去了，才能明白。圣灵就是开门的这一位。"] },
    { title: "风的比喻",
      body: ["还记得上次讲的风的比喻吗？\"风随着意思吹，你听见风的响声，却不晓得从哪里来，往哪里去；凡从圣灵生的，也是如此。\"（约3:8）我们从圣灵的工作来认识圣灵。", "下面，我们继续看圣灵在我们里面的工作。"] },
    { title: "一、认识自己的罪",
      body: ["约翰福音16章7至8节，耶稣说：\"然而，我将真情告诉你们，我去是与你们有益的。我若不去，保惠师就不到你们这里来；我若去，就差祂来。祂既来了，就要叫世人为罪、为义、为审判，自己责备自己。\"", "耶稣应许圣灵降临地上的任务，正是要让世人看见自己的罪。注意\"自己责备自己\"——\"责备\"原文是\"揭露、定罪\"的意思，像法庭上拿出证据，让人无法否认、无可推诿。但圣灵定罪的目的不是羞辱我们，是要带我们回转、得医治。圣灵不是替我们认罪，是让我们自己看见、自己责备、自己回转。"] },
    { title: "圣灵鉴察·女儿的认罪",
      body: ["诗篇139篇7节说：\"我往哪里去躲避祢的灵？我往哪里逃、躲避祢的面？\"这正描写出圣灵无所不在的能力。圣灵知道我们每一个想法，每一个行动！我们躲不开祂，祂却鉴察我们。", "对我最深刻的一个例子，是女儿大学期间的事。那次圣灵让她看见自己的罪，她认罪悔改。这就是圣灵的工作：不是定我们的罪，乃是叫我们\"自己责备自己\"，然后回转。"] },
    { title: "光照我做父亲的亏欠",
      body: ["圣灵也光照我做父亲的亏欠。以弗所书6章4节：\"你们作父亲的，不要惹儿女的气，只要照着主的教训和警戒养育他们。\"歌罗西书3章21节：\"你们作父亲的，不要惹儿女的气，恐怕他们失了志气。\"这两节值得放在一起看：都是对父亲说的，重点都是\"不要惹儿女的气\"。神重复两次，说明这事重要。\"惹儿女的气\"这个词，原文意思是持续地激怒、刺激孩子的情绪，使他产生反感或愤怒。圣经还说\"不可含怒到日落\"，管教要在爱里，不能带着怒气过夜。我反省：以前管教不当，惹了儿女的气；没有和孩子建立良好的关系；孩子大了，不能放手让孩子独立承担责任；说到底，是不信任神。圣灵让我看见这些，我认罪。"] },
    { title: "认罪——圣灵工作的起点",
      body: ["陶恕打过一个比方：假如颈项上长了毒瘤，你一定希望尽快切除。这时候如果有人拿条项链给你戴，你会说：\"我不要项链，我要的是医治！\"真心渴求除去罪孽的人，圣灵一光照，他就欢喜快乐地认罪。", "今天我常常在准备讲道、祷告的时候，圣灵让我看到我的罪。所以保罗到了晚年还说：\"我是罪人中的罪魁。\"越亲近神，越看见自己的罪；越被圣灵光照，越不敢自夸。", "陶恕说：要重新投入神的怀抱，先是借着祈祷、顺服与认罪，重新邀请圣灵进入我们里面。认罪是圣灵工作的起点，一个不肯认罪的人，圣灵很难在他身上往下做工。"] },
    { title: "二、胜过我们的软弱",
      body: ["罗马书8章2至4节：\"因为赐生命圣灵的律，在基督耶稣里释放了我，使我脱离罪和死的律了。律法既因肉体软弱，有所不能行，神就差遣自己的儿子，成为罪身的形状，作了赎罪祭，在肉体中定了罪案，使律法的义成就在我们这不随从肉体、只随从圣灵的人身上。\"", "让我解释一下这里的含义，帮助大家明白。这里的\"律\"，原文不只是\"律法\"，也是\"定律、原则\"的意思，就像地心引力是个定律。这里有两个定律在较量：\"罪和死的律\"把我们往下拉，\"赐生命圣灵的律\"把我们往上提。\"释放\"原文是\"使自由\"：圣灵的定律一运行，就把我们从罪和死的定律里释放出来，得了自由。"] },
    { title: "律法没有给能力",
      body: ["律法就是神借摩西颁布的律法，就是不可偷、不可抢、不可贪婪等等。但是律法有一个问题：它不会给你能力，帮助你遵守。所以这里讲，律法会因肉体的软弱，让我们无法行出来。我们站在十诫面前，它没有给我们任何能力成为完全人，反而显明我们倾向犯罪的肉体是多么软弱。"] },
    { title: "请勿触摸——律法反激起欲望",
      body: ["神的律法是好的，告诉我们什么是神所喜悦的生命，但律法本身不给能力。而且有时刚好相反：律法说不可以做这件事，人心里偏偏想去做。就像墙上写着\"请勿触摸\"，本来没人注意那面墙，一写上这几个字，人就好奇想去摸。小孩子看见炉子，越说不能碰越想碰；短视频里写着\"请勿揭开看\"，人偏要揭开。我们人就是这样，一看到律法，反而引起触犯的欲望。以色列的历史见证了：外面的律法，无法改变里面的生命。"] },
    { title: "地心引力与飞机",
      body: ["律法就像地心的引力，带来的是罪和死。我们一出生就生在罪里，带着罪性，\"罪的工价乃是死\"。我们每个人都走在走向死亡的路上，像被地心引力往下吸。但\"赐生命圣灵的律\"，在基督耶稣里释放了我们，脱离罪和死的律。", "打个比方：飞机也受地心引力，但有航空动力学的定律，让飞机飞上去。地心引力没有消失——发动机一停，飞机就掉下来。但只要动力持续，飞机就一直在天上。我们里面有犯罪的倾向，总被堕落的事吸引，但神住在我们里面，就给我们力量胜过罪恶。我们不是靠行律法胜过罪，是靠里面更大的能力。"] },
    { title: "运行——圣灵在里面发动",
      body: ["腓立比书2章13节：\"因为你们立志行事，都是神在你们心里运行，为要成就祂的美意。\"住在我们里面的圣灵在\"运行\"，\"运行\"原文是\"在里面发动、产生果效\"——英文\"能量\"这个词就是从这个字根来的。圣灵在我们里面发动，像引擎发动一样，产生真实的果效：就让你开始渴慕神的事，想要做讨神喜悦的事。不是因为必须做，是因为想要做。"] },
    { title: "渴慕灵奶、渴慕祷告",
      body: ["圣灵在我们里面做的一件事，就是让我们渴慕神的话语。彼得前书2章1至2节：\"就要爱慕那纯净的灵奶，像才生的婴孩爱慕奶一样，叫你们因此渐长，以至得救。\"\"灵奶\"原文是\"纯净的、没有掺假的奶\"：婴孩要喝纯净的奶才能长大，我们也要纯净的神的话。一个有圣灵住在里面的基督徒，很明显的明证就是开始渴慕神的话，像婴孩肚子饿要吃奶一样。圣灵帮助我们渴慕神的话，改变我们原有的思想认知。", "也渴慕祷告！就像恋爱中的人，总想和对方待在一起，总想和对方说话。圣灵让我们爱上和神说话。"] },
    { title: "三、满结果子",
      body: ["加拉太书5章22至23节：\"圣灵所结的果子，就是仁爱、喜乐、和平、忍耐、恩慈、良善、信实、温柔、节制。这样的事没有律法禁止。\"", "注意\"果子\"原文是单数！不是九种果子，是一份果子、九种味道——就像一个橘子有好多瓣，但它是一个橘子。圣灵在我们里面结出一份完整的果子，带着九种味道。"] },
    { title: "果子不是工厂",
      body: ["圣经告诉我们，圣灵希望为那些肯把生命交上的信徒，带来满结果子、喜乐、和平、蒙福与满足的生命，并且透过他们向众人彰显这美好的生命。每个信徒都应该活出这样满结果子、快乐、蒙福、被圣灵充满的生命。", "注意，这里说的是\"果子\"，不是\"工厂\"。果子是从树上自然结出来的：苹果树只结苹果，橘子树只长橘子。当我们对圣灵的感动有回应，不断依靠祂，从祂那里得力量来生活，生命就开始结果子。这种果子是我们的品格，是我们待人行事的方式，从生命里面自然结出来，别人也看为美好。"] },
    { title: "旷野变肥田",
      body: ["先知以赛亚早就预言圣灵浇灌的美好：\"等到圣灵从上浇灌我们，旷野就变为肥田，肥田看如树林。\"（赛32:15）圣灵一来，旷野变肥田，生命就结果子。耶稣也应许：\"你们虽然不好，尚且知道拿好东西给儿女；何况天父，岂不更将圣灵给求祂的人吗？\"（路11:13）天父乐意把圣灵赐给求祂的人，不用害怕，只管放心求、放心领受。"] },
    { title: "降伏顺服、与圣灵同工",
      body: ["当一个人真正重生得救，顺服圣灵的带领，生命就有很多改变：不再暴怒，不说谎，不做负面消极的事，甚至自己都没察觉。这都是住在里面的圣灵的工作。圣灵让人有大喜乐、大平安，行为也改变，以前常做的事现在不喜欢做了。", "秘诀不是靠努力改变自己，而是学习降伏、顺服，与圣灵同工。降伏于住在我们里面的圣灵，圣灵的生命就透过我们展现出来：让我们对罪敏感，肯悔改，离开过去的行为，照着神活出新生命。神把祂的灵放在我们里面，先从里面开始改变——里面想要改变，然后对坏事敏感，想要过不一样的生命。"] },
    { title: "果子的甘甜·儿子的经历",
      body: ["看看这些果子何等甘甜。耶稣充满爱；祂很喜乐，比任何人都喜乐；祂充满平安，从不为任何事担忧；祂忍耐，对什么人都有耐心；祂对不配的人显出恩慈；祂走到哪里都显出良善；祂对父神的呼召、对人总是信实；祂温柔；祂节制，生活自律。圣灵在我们里面结出的果子，就是让我们越来越像主耶稣基督。", "我儿子十一年级的时候，有一些经历，当时我不明白。现在回头看，我会看顾他，让他经历这些，是为了他的成长。神也这样对待我们：祂让我们经历一些事，是为了让我们结果子，长大成熟。"] },
    { title: "四、传福音的能力",
      body: ["前面是圣灵在我们里面的工作，下面是圣灵给我们对外的能力：先是传福音的能力。", "路加福音24章49节，耶稣说：\"我要将我父所应许的降在你们身上，你们要在城里等候，直到你们领受从上头来的能力。\"", "注意\"从上头来\"——这能力的源头不在我们里面，在天上，是天上赐下来的，不是地上练出来的。这个\"能力\"，希腊文是dunamis，英文\"dynamite\"（炸药）就是从这个词来的，是爆炸性的能力。"] },
    { title: "等候能力·狮子与宠物狗",
      body: ["注意，主吩咐门徒出去把福音传给万民，使人因信得救，但祂却禁止他们马上起行。他们要在城里等候，因为主有更好的安排：先领受能力，再出去传。没有能力的传福音，是事倍功半；有圣灵的能力，才事半功倍。", "陶恕打过一个比方：有四五头狮子向你跑来，你身边蹲着一只小小的宠物狗，你对它喊\"露出你的狮子本色\"，喊破喉咙也没用，狮子只会把它当点心吃掉。我们人就是这样，凭自己根本没有能力。全能的神说：\"我不要使你们内在的能力苏醒，我却要叫你们领受圣灵降临在你们身上的大能大力！\"我们需要的，不是把自己里面那点小能力喊醒，而是从天而来的能力。"] },
    { title: "五旬节前的门徒",
      body: ["想想五旬节之前的门徒：跟随耶稣三年，亲眼见祂死而复活，耶稣亲手教了三年，还给他们权柄去医病赶鬼。但耶稣仍然说：要在城里等候，直到领受从上头来的能力。连这样的门徒都需要圣灵的能力，何况我们？"] },
    { title: "扎心——彼得的讲道",
      body: ["五旬节那天，彼得和十一个使徒站起来，成为地上的见证人，向众人见证天上的事。陶恕说，这正是教会应有的身份。然后彼得见证说：\"这耶稣，神已经叫祂复活了，我们都为这事作见证。祂既被神的右手高举，又从父受了所应许的圣灵，就把你们所看见所听见的，浇灌下来。\"（徒2:32-33）众人\"觉得扎心\"。使徒行传2章37节：\"众人听见这话，觉得扎心，就对彼得和其余的使徒说：弟兄们，我们当怎样行？\"这个\"扎心\"，原文是\"刺透\"，新约圣经只在这里出现过一次。不是轻轻碰一下，是刺透——像一把利剑直刺进心里。约翰福音描写兵丁拿枪刺耶稣肋旁，用的词还没有这个\"扎心\"厉害。彼得一篇道，比枪刺肋旁更有力，直刺人心。难怪他们立刻问：\"我们当怎样行？\"这就是圣灵的能力。"] },
    { title: "为用的能力",
      body: ["假如你要赢取人的灵魂，你就会得到赢取人灵魂的能力。神不给我们用不上的能力，祂给的，都是为要我们去用的。教会应当见证那超乎地上与人类能力的大能，这大能就是神的灵。今天我们也要虔敬、全心地祈求：主啊，求祢把昔日赐给门徒的能力，同样在今日赐给我们。"] },
    { title: "五、得着恩赐",
      body: ["圣灵给我们能力和恩赐，是让我们服侍主、服侍教会、服侍他人。", "\"按我们所得的恩赐，各有不同。\"（罗12:6）\"要切切地求那更大的恩赐。\"（林前12:31）\"祂升上高天的时候，掳掠了仇敌，将各样的恩赐赏给人。\"（弗4:8）", "\"恩赐\"原文是从\"恩典\"这个词来的，意思是\"恩典的礼物\"——是神白白赏给的，不是我们配得的。恩赐是为神行事的能力，不是天生的才干：才干人人都有，恩赐是圣灵特别赐下，为要完成神的工作。"] },
    { title: "身体与肢体·恩赐有哪些",
      body: ["保罗在三封书信里，用人肉身的肢体来比拟教会：罗马书、哥林多前书、以弗所书。教会是一个身体，基督是头，我们是肢体。圣灵跟教会的关系，就像人的灵跟肉身的关系。", "恩赐有哪些呢？有做使徒的、做先知的、做教师的、做劝化人的、做治理的，还有智慧、知识、信心、医治、行神迹、辨别诸灵、帮助人、怜悯人的恩赐。它们借着圣灵，在基督的身体里各自发挥功用，彼此配搭。"] },
    { title: "听头的话·肚子的比方",
      body: ["只要你的双手肯听头的话，一切就没问题；两腿肯接受头的号令，过马路就不会被车撞。教会也一样：每个肢体都听元首基督的吩咐，就像人的身体，眼睛负责看，耳朵负责听，手脚负责做，口负责说，各有各特殊的存在目的和功能，互相合作，不拿自己的强项去比别人的弱项，这就是健康的身体，也是健康的教会。", "在教会里，我们也要这样领受恩赐。陶恕说：你的肚子是神的恩赐，它的作用不是给西裤有个支撑的地方，肚子自有肚子的存在目的与功能。在教会里，每个恩赐也都有它存在的目的，就是为完成神的工作。"] },
    { title: "拼图·恩赐的目的",
      body: ["教会像一幅拼图，每一块都要放在对的位置。我们的责任，就是明白神给每个人的负担，帮助大家成就神给自己的使命。不要用自己的强项去比别人的弱项，要彼此配搭。我们的教会若是这样，自然就复兴、蒙神赐福。", "但要注意恩赐的目的。哥林多前书12章4至7节：\"恩赐原有分别，圣灵却是一位；职事也有分别，主却是一位；功用也有分别，神却是一位，在众人里面运行一切的事。圣灵显在各人身上，是叫人得益处。\""] },
    { title: "叫众人得益处",
      body: ["\"是叫人得益处\"——\"得益处\"原文是\"共同的好处\"。这个\"人\"是谁？从上下文和原文看，不是单指领受恩赐的\"个人\"，而是\"众人\"。注意前面说\"圣灵显在各人身上\"——\"各人\"就是每一个人，圣灵把恩赐给每一个人，目的是为了大家共同的好处。不是\"我得益处\"，是\"众人得益处\"。", "有人有教导的恩赐，帮助别人明白真理；有人有怜悯的恩赐，安慰软弱的人；有人有治理的恩赐，让教会有秩序；有人有传福音的恩赐，带更多人认识基督；有人有奉献、接待、服事的恩赐，供应教会的需要。恩赐是神给我的，但最终受益的，是基督的身体。"] },
    { title: "结语：荣耀基督",
      body: ["圣灵要为人带来安慰与教导，因祂是指引的灵；祂要为人带来光明，因祂是光明的灵；祂要为人带来纯洁，因祂是圣洁的灵；祂要为人带来能力，因祂是能力的灵。祂要把种种祝福，带进我们的内心。", "陶恕说：耶稣在哪里得荣耀，那里就有圣灵降临。我们无须刻意祈求，只要尽力荣耀救主，就必得着圣灵充满。陶恕又说：当我看见今日教会仅凭借人为的能力行事时，心里实在非常忧伤。我们需要圣灵。不是倚靠势力，不是倚靠才能，乃是倚靠神的灵，方能成事。"] },
    { title: "卫斯理·总结圣灵的工作",
      body: ["约翰卫斯理在大西洋的风暴中，看见弟兄会的信徒毫不惧怕，挤在一起满心喜乐地唱诗。他问为什么，他们说：\"假如主希望我们全部遇溺，那骤然的死亡就会变成骤然的荣耀了！\"这就是圣灵在人里面的工作：神借着圣言和圣灵，让信仰变得真实，不再是道理，而是生命。", "圣灵在我们里面的工作——让我们进入真理、认识自己的罪、胜过软弱、满结果子；圣灵给我们对外的能力——传福音的能力、服侍的恩赐。这一切的目的，都是把我们带到基督面前，荣耀祂。"] },
    { title: "应许与呼召",
      body: ["神应许：\"我要将水浇灌口渴的人，将河浇灌干旱之地；我要将我的灵浇灌你的后裔，将我的福浇灌你的子孙。\"（赛44:3）", "弟兄姊妹，圣灵今天就在我们中间。祂要光照我们的罪，赐我们胜过软弱的力量，让我们结果子，给我们传福音的能力和服侍的恩赐。愿我们都向祂敞开，让祂在我们生命中自由地工作。阿们。"] }
  ];

  var idx = 0, fs = 34, READMIN = 28, manual = false;
  var root = document.documentElement;
  var ptitle = document.getElementById('ptitle');
  var pbody = document.getElementById('pbody');
  var pagenum = document.getElementById('pagenum');
  var page = document.getElementById('page');
  var SETKEY = 'sermon-teleprompter-v1';

  // 记住用户的字号偏好（手机和 tablet 各记各的）
  try {
    var sv = JSON.parse(localStorage.getItem(SETKEY) || 'null');
    if (sv && sv.fs >= 20 && sv.fs <= 72) { fs = sv.fs; manual = !!sv.manual; }
  } catch (e) {}
  function saveSettings() {
    try { localStorage.setItem(SETKEY, JSON.stringify({ fs: fs, manual: manual, spd: spd })); } catch (e) {}
  }

  // 自动模式：尽量一屏放下，但字不缩到看不清；
  // 小屏实在放不下时，保持可读字号、允许滚动看全
  function fitPage() {
    manual = false;
    page.classList.remove('free');
    page.style.overflowY = 'hidden';
    root.style.setProperty('--fs', fs + 'px');
    var cur = fs;
    var guard = 0;
    while (page.scrollHeight > page.clientHeight + 2 && cur > READMIN && guard < 40) {
      cur -= 2;
      root.style.setProperty('--fs', cur + 'px');
      guard++;
    }
    if (page.scrollHeight > page.clientHeight + 2) {
      page.classList.add('free');
      page.style.overflowY = 'auto';
    }
    saveSettings();
  }
  // 手动调字号：听用户的，不自动缩；字号翻页保持，放太大时允许滚动
  function manualSize() {
    manual = true;
    page.classList.add('free');
    page.style.overflowY = 'auto';
    root.style.setProperty('--fs', fs + 'px');
    saveSettings();
  }

  function render() {
    var p = PAGES[idx];
    ptitle.textContent = p.title;
    pbody.innerHTML = '';
    p.body.forEach(function (t) {
      var el = document.createElement('p');
      if (/章|節/.test(t) && t.length < 80) el.className = 'verse';
      el.textContent = t;
      pbody.appendChild(el);
    });
    pagenum.textContent = (idx + 1) + ' / ' + PAGES.length;
    page.scrollTop = 0;
    if (manual) manualSize(); else fitPage();
  }
  function next() { if (idx < PAGES.length - 1) { idx++; render(); } }
  function prev() { if (idx > 0) { idx--; render(); } }

  document.getElementById('next').addEventListener('click', next);
  document.getElementById('prev').addEventListener('click', prev);
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (scrollOn) {
      /* 滚动模式：右/下/空格/回车 = 暂停·继续；左/上 = 往回滚一屏 */
      if (k === ' ' || k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === 'Enter') {
        togglePause(); e.preventDefault();
      } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') {
        page.scrollTop = Math.max(0, page.scrollTop - page.clientHeight * 0.8);
        e.preventDefault();
      }
      return;
    }
    /* 翻页模式：右/下/空格/回车 = 下一页；左/上 = 上一页 */
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'ArrowDown' || k === 'Enter') {
      next(); e.preventDefault();
    }
    if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp') {
      prev(); e.preventDefault();
    }
  });
  document.getElementById('page').addEventListener('click', function (e) {
    if (scrollOn) { togglePause(); return; }
    var w = window.innerWidth;
    if (e.clientX > w * 0.75) next();
    else if (e.clientX < w * 0.25) prev();
  });
  // 横竖屏切换时重算字号（手动模式下保持用户字号）
  window.addEventListener('resize', function () { if (!manual && !scrollOn) fitPage(); });

  document.getElementById('bigger').addEventListener('click', function () {
    fs = Math.min(fs + 4, 72);
    if (scrollOn) { root.style.setProperty('--fs', fs + 'px'); saveSettings(); }
    else manualSize();
  });
  document.getElementById('smaller').addEventListener('click', function () {
    fs = Math.max(fs - 4, 20);
    if (scrollOn) { root.style.setProperty('--fs', fs + 'px'); saveSettings(); }
    else manualSize();
  });
  // 回到自动一屏模式（滚动模式下点它会打乱滚动，先忽略）
  document.getElementById('autofit').addEventListener('click', function () {
    if (!scrollOn) fitPage();
  });
  document.getElementById('theme').addEventListener('click', function () {
    document.body.classList.toggle('light');
  });
  document.getElementById('full').addEventListener('click', function () {
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
    else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  });

  // 页内安装按钮：只有 Chrome 判定可安装时才出现，装完自动消失
  (function () {
    var btn = document.getElementById('installBtn');
    var deferredPrompt = null;
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                       window.navigator.standalone === true;
    if (isStandalone) return;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      window.__bipFired = true;
      btn.classList.add('show');
    });
    window.addEventListener('appinstalled', function () {
      btn.classList.remove('show');
      deferredPrompt = null;
    });
    btn.addEventListener('click', function () {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
      }
    });
  })();

  /* 自动滚动模式：整篇连起来匀速上滚，速度 1~5 可调 */
  var scrollOn = false, paused = false, spd = 2, rafId = null, lastT = 0, savedIdx = 0;
  var SPDS = [0, 10, 14, 20, 28, 40, 56, 80]; /* 每秒像素，1~7 档 */
  var scrollToggle = document.getElementById('scrollToggle');
  var pauseBtn = document.getElementById('pauseBtn');
  var nav = document.getElementById('nav');
  try {
    var sv2 = JSON.parse(localStorage.getItem(SETKEY) || 'null');
    if (sv2 && sv2.spd >= 1 && sv2.spd <= 7) spd = sv2.spd;
  } catch (e2) {}
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function buildScroll() {
    var h = '';
    PAGES.forEach(function (p) {
      h += '<div class="sec-title">' + esc(p.title) + '</div>';
      p.body.forEach(function (t) {
        var cls = (/章|節/.test(t) && t.length < 80) ? ' class="verse"' : '';
        h += '<p' + cls + '>' + esc(t) + '</p>';
      });
    });
    return h;
  }
  function updScrollUI() {
    pagenum.textContent = '滚动中 · 速度' + spd + (paused ? ' · 已暂停' : '');
    pauseBtn.textContent = paused ? '▶继续' : '⏸暂停';
  }
  function setPaused(p) { paused = p; updScrollUI(); }
  function togglePause() { if (scrollOn) setPaused(!paused); }
  function loop(t) {
    if (!scrollOn) return;
    var dt = (t - lastT) / 1000; lastT = t;
    if (!paused) {
      page.scrollTop += SPDS[spd] * dt;
      if (page.scrollTop + page.clientHeight >= page.scrollHeight - 2) setPaused(true);
    }
    rafId = requestAnimationFrame(loop);
  }
  function enterScroll() {
    scrollOn = true; paused = false; savedIdx = idx;
    document.body.classList.add('scrolling');
    page.classList.add('scrollmode');
    page.classList.remove('free');
    page.style.overflowY = 'auto';
    ptitle.textContent = '';
    pbody.innerHTML = buildScroll();
    root.style.setProperty('--fs', fs + 'px');
    nav.style.display = 'none';
    scrollToggle.classList.add('on');
    scrollToggle.textContent = '■退出';
    page.scrollTop = 0;
    updScrollUI();
    cancelAnimationFrame(rafId);
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
  }
  function exitScroll() {
    scrollOn = false; paused = false;
    cancelAnimationFrame(rafId); rafId = null;
    document.body.classList.remove('scrolling');
    page.classList.remove('scrollmode');
    nav.style.display = '';
    scrollToggle.classList.remove('on');
    scrollToggle.textContent = '▶滚动';
    idx = savedIdx; render();
  }
  scrollToggle.addEventListener('click', function () { scrollOn ? exitScroll() : enterScroll(); });
  pauseBtn.addEventListener('click', function () { togglePause(); });
  document.getElementById('spdDown').addEventListener('click', function () {
    if (spd > 1) { spd--; saveSettings(); if (scrollOn) updScrollUI(); }
  });
  document.getElementById('spdUp').addEventListener('click', function () {
    if (spd < 7) { spd++; saveSettings(); if (scrollOn) updScrollUI(); }
  });

  /* ⟳更新：一键清除本地缓存并重新加载最新版 */
  document.getElementById('forceUpdate').addEventListener('click', function () {
    if (!confirm('要清除本地缓存、重新加载最新版讲章吗？')) return;
    var done = function () { location.reload(); };
    if ('caches' in window) {
      caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }).then(function () {
        if ('serviceWorker' in navigator) {
          return navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.update(); }));
          });
        }
      }).then(done, done);
    } else { done(); }
  });

  render();
})();
</script>
</body>
</html>

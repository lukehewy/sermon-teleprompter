<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141428">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>讲道提词器 · 士师记第十课 亚比米勒</title>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js'); }
</script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #111; color: #f5f5f5;
         display: flex; flex-direction: column; height: 100vh; height: 100dvh;
         overflow: hidden; user-select: none; }
  body.light { background: #fdfbf5; color: #1a1a1a; }
  #topbar { flex: none; display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; font-size: 15px; opacity: .85; }
  #topbar .grp { display: flex; gap: 8px; align-items: center; }
  #topbar button { font-size: 16px; padding: 8px 14px; border-radius: 10px;
                   border: 1px solid #555; background: transparent; color: inherit;
                   cursor: pointer; }
  #installBtn { display: none; border-color: #ffd54a !important; color: #ffd54a !important; }
  #installBtn.show { display: inline-block; }
  body.light #installBtn { border-color: #8a6d1b !important; color: #8a6d1b !important; }
  body.light #topbar button { border-color: #bbb; }
  #page { flex: 1; display: flex; flex-direction: column; justify-content: flex-start;
          padding: 20px 44px; overflow: hidden; }
  #pageinner { margin: auto 0; width: 100%; }
  #page.free #pageinner { margin: 0; }
  #ptitle { font-size: calc(var(--fs) * 1.15); font-weight: bold; color: #ffd54a;
            margin-bottom: 28px; line-height: 1.4; }
  body.light #ptitle { color: #8a6d1b; }
  #pbody { font-size: var(--fs); line-height: 1.9; }
  #pbody p { margin: 0 0 22px; }
  #pbody .verse { color: #9fd8c3; }
  body.light #pbody .verse { color: #0d6e5f; }
  #nav { flex: none; display: flex; }
  #nav button { flex: 1; padding: 22px 0; font-size: 22px; border: none;
                background: #1d1d1d; color: #ccc; cursor: pointer; }
  body.light #nav button { background: #eee; color: #555; }
  #nav button:active { background: #2c2c2c; }
  #nav #next { background: #0d3b2e; color: #fff; font-weight: bold; }
  #nav #next:active { background: #147a5b; }
  /* 自动滚动模式 */
  #page.scrollmode { display: block; overflow-y: auto; }
  #page.scrollmode #pageinner { margin: 0; }
  .sec-title { font-size: calc(var(--fs) * 1.15); font-weight: bold; color: #ffd54a;
               margin: 36px 0 20px; line-height: 1.4; }
  body.light .sec-title { color: #8a6d1b; }
  #spdDown, #spdUp { display: none; }
  body.scrolling #spdDown, body.scrolling #spdUp { display: inline-block; }
  #scrollToggle.on { border-color: #ffd54a !important; color: #ffd54a !important; }
  body.light #scrollToggle.on { border-color: #8a6d1b !important; color: #8a6d1b !important; }
  :root { --fs: 34px; }
</style>
</head>
<body>
  <div id="topbar">
    <div class="grp">
      <button id="smaller">A−</button>
      <button id="bigger">A＋</button>
      <button id="autofit">自动</button>
      <button id="scrollToggle">▶滚动</button>
      <button id="spdDown">减速</button>
      <button id="spdUp">加速</button>
      <button id="theme">🌙/☀️</button>
      <button id="full">⛶</button>
      <button id="installBtn">📲 安装</button>
    </div>
    <div id="pagenum">1 / 1</div>
  </div>

  <div id="page">
   <div id="pageinner">
    <div id="ptitle"></div>
    <div id="pbody"></div>
   </div>
  </div>

  <div id="nav">
    <button id="prev">◀ 上一页</button>
    <button id="next">下一页 ▶</button>
  </div>

<script>
(function () {
  // 生命树查经班士师记第十课：亚比米勒 —— 一页一页翻
  var PAGES = [
    { title: "士师记 第十课",
      body: ["亚比米勒",
             "（士 9:1–57）"] },
    { title: "题目",
      body: ["亚比米勒"] },
    { title: "分段",
      body: ["I. 亚比米勒立为王 士 9:1–25",
             "II. 迦勒的谋反失败 士 9:26–49",
             "III. 亚比米勒惨死 士 9:50–57"] },
    { title: "I. 亚比米勒立为王 士 9:1–25",
      body: ["1）杀基甸众子（士 9:1–6）",
             "• 基甸妾生于示剑，母系出身，地位低下",
             "• 以血缘游说示剑人拥戴",
             "• 取庙中七十舍客勒银子雇匪徒",
             "• 杀七十兄弟于磐石上，仅约坦逃脱"] },
    { title: "思想",
      body: ["为争权位，是否玩弄权术、驾驭他人？",
             "「人心比万物都诡诈，坏到极处。」（耶 17:9）"] },
    { title: "I. 亚比米勒立为王 士 9:1–25",
      body: ["2）约坦的比喻（士 9:7–25）",
             "• 三种果树拒绝作王：看重本位，甘心付出",
             "• 荆棘自立为王：无荫、无果、有刺、易引火",
             "• 预言：火从亚比米勒出，烧灭示剑人"] },
    { title: "思想",
      body: ["抱负是自我中心，还是以神为中心？",
             "甘心付出，还是不择手段？"] },
    { title: "II. 迦勒的谋反失败 士 9:26–49",
      body: ["1）迦勒谋反（士 9:26–33）",
             "• 神使恶魔降在亚比米勒和示剑人中间",
             "• 迦勒煽动示剑人跟从他",
             "• 西布勒暗中告密，设伏突袭"] },
    { title: "II. 迦勒的谋反失败 士 9:26–49",
      body: ["2）败于亚比米勒（士 9:34–49）",
             "• 迦勒大败，被赶出示剑",
             "• 示剑城被毁，撒盐永废",
             "• 示剑楼约一千人被烧死，应验预言"] },
    { title: "思想",
      body: ["行事为人按「诚信真实」，还是凭「关系」？",
             "神喜悦儿女以诚实正直行事"] },
    { title: "III. 亚比米勒惨死 士 9:50–57",
      body: ["1）攻打提备斯（士 9:50）",
             "• 百姓逃入「坚固的楼」躲避",
             "• 亚比米勒挨近楼门放火"] },
    { title: "III. 亚比米勒惨死 士 9:50–57",
      body: ["2）悲惨结局（士 9:51–55）",
             "• 妇人抛磨石打破其头",
             "• 耻于死在妇人之手，令少年拔刀杀他"] },
    { title: "III. 亚比米勒惨死 士 9:50–57",
      body: ["3）神的报应（士 9:56–57）",
             "• 神报应他杀七十兄弟之恶",
             "• 「骄傲在败坏以先，狂心在跌倒之前」（箴 16:18）"] },
    { title: "思想",
      body: ["看重的是面子，还是人格？",
             "「耶和华不像人看人，人看外貌，耶和华看内心。」（撒上 16:7）"] },
    { title: "总结",
      body: ["亚比米勒不择手段夺权，杀害七十兄弟；",
             "神使他自相残杀，死于妇人之手。",
             "神是公义的，人种什么收什么。"] }
  ];

  var idx = 0, fs = 34, READMIN = 28, manual = false;
  var root = document.documentElement;
  var ptitle = document.getElementById('ptitle');
  var pbody = document.getElementById('pbody');
  var pagenum = document.getElementById('pagenum');
  var page = document.getElementById('page');
  var SETKEY = 'sermon-teleprompter-v1';

  // 记住用户的字号偏好（手机和 tablet 各记各的）
  try {
    var sv = JSON.parse(localStorage.getItem(SETKEY) || 'null');
    if (sv && sv.fs >= 20 && sv.fs <= 72) { fs = sv.fs; manual = !!sv.manual; }
  } catch (e) {}
  function saveSettings() {
    try { localStorage.setItem(SETKEY, JSON.stringify({ fs: fs, manual: manual, spd: spd })); } catch (e) {}
  }

  // 自动模式：尽量一屏放下，但字不缩到看不清；
  // 小屏实在放不下时，保持可读字号、允许滚动看全
  function fitPage() {
    manual = false;
    page.classList.remove('free');
    page.style.overflowY = 'hidden';
    root.style.setProperty('--fs', fs + 'px');
    var cur = fs;
    var guard = 0;
    while (page.scrollHeight > page.clientHeight + 2 && cur > READMIN && guard < 40) {
      cur -= 2;
      root.style.setProperty('--fs', cur + 'px');
      guard++;
    }
    if (page.scrollHeight > page.clientHeight + 2) {
      page.classList.add('free');
      page.style.overflowY = 'auto';
    }
    saveSettings();
  }
  // 手动调字号：听用户的，不自动缩；字号翻页保持，放太大时允许滚动
  function manualSize() {
    manual = true;
    page.classList.add('free');
    page.style.overflowY = 'auto';
    root.style.setProperty('--fs', fs + 'px');
    saveSettings();
  }

  function render() {
    var p = PAGES[idx];
    ptitle.textContent = p.title;
    pbody.innerHTML = '';
    p.body.forEach(function (t) {
      var el = document.createElement('p');
      if (/章|節/.test(t) && t.length < 80) el.className = 'verse';
      el.textContent = t;
      pbody.appendChild(el);
    });
    pagenum.textContent = (idx + 1) + ' / ' + PAGES.length;
    page.scrollTop = 0;
    if (manual) manualSize(); else fitPage();
  }
  function next() { if (idx < PAGES.length - 1) { idx++; render(); } }
  function prev() { if (idx > 0) { idx--; render(); } }

  document.getElementById('next').addEventListener('click', next);
  document.getElementById('prev').addEventListener('click', prev);
  document.addEventListener('keydown', function (e) {
    if (scrollOn) {
      if (e.key === ' ') { togglePause(); e.preventDefault(); }
      return;
    }
    if (e.key === 'ArrowRight' || e.key === ' ') next();
    if (e.key === 'ArrowLeft') prev();
  });
  document.getElementById('page').addEventListener('click', function (e) {
    if (scrollOn) { togglePause(); return; }
    var w = window.innerWidth;
    if (e.clientX > w * 0.75) next();
    else if (e.clientX < w * 0.25) prev();
  });
  // 横竖屏切换时重算字号（手动模式下保持用户字号）
  window.addEventListener('resize', function () { if (!manual) fitPage(); });

  document.getElementById('bigger').addEventListener('click', function () {
    fs = Math.min(fs + 4, 72);
    if (scrollOn) { root.style.setProperty('--fs', fs + 'px'); saveSettings(); }
    else manualSize();
  });
  document.getElementById('smaller').addEventListener('click', function () {
    fs = Math.max(fs - 4, 20);
    if (scrollOn) { root.style.setProperty('--fs', fs + 'px'); saveSettings(); }
    else manualSize();
  });
  // 回到自动一屏模式
  document.getElementById('autofit').addEventListener('click', function () {
    fitPage();
  });
  document.getElementById('theme').addEventListener('click', function () {
    document.body.classList.toggle('light');
  });
  document.getElementById('full').addEventListener('click', function () {
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
    else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  });

  // 页内安装按钮：只有 Chrome 判定可安装时才出现，装完自动消失
  (function () {
    var btn = document.getElementById('installBtn');
    var deferredPrompt = null;
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                       window.navigator.standalone === true;
    if (isStandalone) return;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      window.__bipFired = true;
      btn.classList.add('show');
    });
    window.addEventListener('appinstalled', function () {
      btn.classList.remove('show');
      deferredPrompt = null;
    });
    btn.addEventListener('click', function () {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
      }
    });
  })();

  /* 自动滚动模式：整篇连起来匀速上滚，速度 1~5 可调 */
  var scrollOn = false, paused = false, spd = 2, rafId = null, lastT = 0, savedIdx = 0;
  var SPDS = [0, 16, 30, 48, 72, 100]; /* 每秒像素 */
  var scrollToggle = document.getElementById('scrollToggle');
  var nav = document.getElementById('nav');
  try {
    var sv2 = JSON.parse(localStorage.getItem(SETKEY) || 'null');
    if (sv2 && sv2.spd >= 1 && sv2.spd <= 5) spd = sv2.spd;
  } catch (e2) {}
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function buildScroll() {
    var h = '';
    PAGES.forEach(function (p) {
      h += '<div class="sec-title">' + esc(p.title) + '</div>';
      p.body.forEach(function (t) {
        var cls = (/章|節/.test(t) && t.length < 80) ? ' class="verse"' : '';
        h += '<p' + cls + '>' + esc(t) + '</p>';
      });
    });
    return h;
  }
  function updScrollUI() {
    pagenum.textContent = '滚动中 · 速度' + spd + (paused ? ' · 已暂停' : '');
    scrollToggle.textContent = paused ? '▶继续' : '⏸暂停';
  }
  function setPaused(p) { paused = p; updScrollUI(); }
  function togglePause() { if (scrollOn) setPaused(!paused); }
  function loop(t) {
    if (!scrollOn) return;
    var dt = (t - lastT) / 1000; lastT = t;
    if (!paused) {
      page.scrollTop += SPDS[spd] * dt;
      if (page.scrollTop + page.clientHeight >= page.scrollHeight - 2) setPaused(true);
    }
    rafId = requestAnimationFrame(loop);
  }
  function enterScroll() {
    scrollOn = true; paused = false; savedIdx = idx;
    document.body.classList.add('scrolling');
    page.classList.add('scrollmode');
    page.classList.remove('free');
    page.style.overflowY = 'auto';
    ptitle.textContent = '';
    pbody.innerHTML = buildScroll();
    root.style.setProperty('--fs', fs + 'px');
    nav.style.display = 'none';
    scrollToggle.classList.add('on');
    page.scrollTop = 0;
    updScrollUI();
    cancelAnimationFrame(rafId);
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
  }
  function exitScroll() {
    scrollOn = false; paused = false;
    cancelAnimationFrame(rafId); rafId = null;
    document.body.classList.remove('scrolling');
    page.classList.remove('scrollmode');
    nav.style.display = '';
    scrollToggle.classList.remove('on');
    scrollToggle.textContent = '▶滚动';
    idx = savedIdx; render();
  }
  scrollToggle.addEventListener('click', function () { scrollOn ? exitScroll() : enterScroll(); });
  document.getElementById('spdDown').addEventListener('click', function () {
    if (spd > 1) { spd--; saveSettings(); if (scrollOn) updScrollUI(); }
  });
  document.getElementById('spdUp').addEventListener('click', function () {
    if (spd < 5) { spd++; saveSettings(); if (scrollOn) updScrollUI(); }
  });

  render();
})();
</script>
</body>
</html>

      body: ["圣灵在我们里面做的一件事，就是让我们渴慕神的话语。", "彼得前书2章1至2节：", "“就要爱慕那纯净的灵奶，像才生的婴孩爱慕奶一样，叫你们因此渐长，以至得救。”", "“灵奶”原文是“纯净的、没有掺假的奶”：婴孩要喝纯净的奶才能长大，我们也要纯净的神的话。", "一个有圣灵住在里面的基督徒，很明显的明证就是开始渴慕神的话，像婴孩肚子饿要吃奶一样。"] },
    { title: "（六）渴慕神的话语",
      body: ["圣灵帮助我们渴慕神的话，改变我们原有的思想认知。"] },
    { title: "（七）借着祷告亲近神",
      body: ["圣灵也让我们渴慕祷告", "圣灵不仅让我们渴慕神的话语，也让我们渴慕祷告，愿意亲近神。", "就像恋爱中的人，总想和对方待在一起，总想和对方说话。因为心里有爱，所以有许多话想说。", "我们与神的关系也是这样。当圣灵在我们里面工作的时候，我们就开始喜欢祷告，愿意来到神面前，把心里的喜乐、忧虑和软弱都告诉祂。", "祷告不只是向神提出要求，更是与神亲近，与神交通。"] },
    { title: "（七）借着祷告亲近神",
      body: ["圣灵让我们越来越渴慕神的话语，也越来越愿意借着祷告亲近神。"] },
    { title: "三、满结果子",
      body: ["前面我们讲到,圣灵住在我们里面,帮助我们胜过我们的软弱。当我们胜过软弱的时候,圣灵也让我们的生命结出神所喜悦的果实。接着我们来看圣灵第三方面的工作:满结果子。加拉太书五章二十二至二十三节:“圣灵所结的果子,就是仁爱、喜乐、和平、忍耐、恩慈、良善、信实、温柔、节制。这样的事没有律法禁止。”注意,“果子”在原文中是单数,不是九种不同的果子,而是一个果子具有多种美好的特质。就像一个橘子,里面有甜、有酸,甚至有一点点苦涩,但这些味道都在同一个橘子里。"] },
    { title: "（一）生命自然结出果子",
      body: ["同样,圣灵在我们生命中所结的果子,也表现出仁爱、喜乐、和平、忍耐等不同的美好品格。圣灵在我们生命中工作,让我们结出美好的果子,活出喜乐、平安、蒙福的生命,也让周围的人看见神在我们身上的改变。注意,这里说的是“果子”,不是“工厂”。工厂可以生产不同的产品。果子是从树上自然结出来的:苹果树只结苹果,橘子树只长橘子。当我们对圣灵的感动有回应,不断依靠祂,从祂那里得力量来生活,生命就开始结果子。这种果子是我们的品格,是我们待人行事的方式,从生命里面自然结出来,别人也看为美好。"] },
    { title: "（二）顺服圣灵的带领",
      body: ["当一个人真正重生得救,顺服圣灵的带领,生命就有很多改变:不再暴怒,不说谎,不做负面消极的事,甚至自己都没察觉。这都是住在里面的圣灵的工作。圣灵让人有大喜乐、大平安,行为也改变,以前常做的事现在不喜欢做了。秘诀不是靠努力改变自己,而是学习降伏、顺服,与圣灵同工。降伏于住在我们里面的圣灵,圣灵的生命就透过我们展现出来:让我们对罪敏感,肯悔改,离开过去的行为,照着神活出新生命。"] },
    { title: "（三）活出主耶稣的品格",

    { title: "（四）在忧虑中领受平安",

    { title: "（四）在忧虑中领受平安",

    { title: "（一）从生命更新到为主作见证",

    { title: "（二）等候从上头来的能力",

    { title: "（二）等候从上头来的能力",

    { title: "（二）等候从上头来的能力",

    { title: "（二）等候从上头来的能力",

    { title: "（三）承认自己能力的有限",

    { title: "（三）承认自己能力的有限",

    { title: "（四）门徒也需要圣灵的能力",

    { title: "（五）圣灵使门徒放胆作见证",

    { title: "（六）圣灵使听道的人扎心",
      body: ["彼得把这篇道讲完以后，众人的反应是什么呢？", "使徒行传2章37节告诉我们：", "“众人听见这话，觉得扎心，就对彼得和其余的使徒说：弟兄们，我们当怎样行？”", "这里的“扎心”，意思是被刺透，像利剑扎进心里，非常深。", "约翰福音描写兵丁拿枪刺耶稣的肋旁，用的那个“刺”字，还没有这里的“扎心”厉害。", "难怪他们立刻问：“我们当怎样行？”", "这就是圣灵的能力。"] },
    { title: "（七）靠圣灵的大能传福音",
      body: ["假如你要赢取人的灵魂，就要取得赢取人灵魂的能力。", "不能单单靠我们自己，而要靠神所赐圣灵的大能来工作。"] },
    { title: "五、得着恩赐",
      body: ["圣灵不仅赐给我们传福音的能力，也赐给我们各样的恩赐，使我们能够服侍主、服侍教会，也服侍他人。", "“按我们所得的恩赐，各有不同。”（罗12:6）", "“要切切地求那更大的恩赐。”（林前12:31）", "“祂升上高天的时候，掳掠了仇敌，将各样的恩赐赏给人。”（弗4:8）", "这三节经文都提到了恩赐。那么，什么是恩赐呢？"] },
    { title: "五、得着恩赐",
      body: ["“恩赐”原文是从“恩典”这个词来的，意思是“恩典的礼物”，是神白白赏给的，不是我们配得的。", "这里我们要特别注意，恩赐是神为了完成祂的工作而赐给我们的能力，不是我们自己天生的才干。"] },
    { title: "（一）认识圣经中的属灵恩赐",
      body: ["圣经中有好几处讲到属灵的恩赐，特别是在《罗马书》第十二章、《哥林多前书》第十二章、《以弗所书》第四章，以及《彼得前书》第四章。", "提到的恩赐有做使徒的、做先知的、做教师的、做劝化人的、做治理的，还有智慧的言语、知识的言语、信心、医治、行神迹、辨别诸灵、帮助人、怜悯人等。"] },
    { title: "（一）认识圣经中的属灵恩赐",
      body: ["但我们要注意，神把不同的恩赐赐给我们，不是为了让我们表现自己多有能力，也不是让我们觉得自己比别人更属灵、更有本事。", "那么，神为什么要把这些恩赐赐给我们呢？祂主要的目的是什么呢？", "主要的目的有两个。", "第一，是为了建立基督的身体——教会。"] },
    { title: "（二）彼此配搭建立教会",
      body: ["圣灵赐下这些不同的恩赐，是为了建立基督的身体——教会。", "保罗在《罗马书》《哥林多前书》和《以弗所书》这三卷书信中，都用人的身体和肢体来比喻教会。", "他在哥林多前书12章27节说：", "“你们就是基督的身子，并且各自作肢体。”", "教会就是基督的身体，我们每一个人都是这个身体上的肢体。"] },
    { title: "（二）彼此配搭建立教会",

    { title: "（三）找到各自在教会中的位置",

    { title: "（四）运用恩赐使众人得益处",
      body: ["第二，圣灵赐下恩赐，是为了帮助别人。", "哥林多前书12章4至7节说：", "“恩赐原有分别，圣灵却是一位；职事也有分别，主却是一位；功用也有分别，神却是一位，在众人里面运行一切的事。圣灵显在各人身上，是叫人得益处。”", "特别要注意最后一句话：“圣灵显在各人身上，是叫人得益处。”", "这里的“得益处”，原文有“共同的好处”的意思。"] },
    { title: "（四）运用恩赐使众人得益处",

    { title: "（四）运用恩赐使众人得益处",

  ];

  var idx = 0, fs = 34, READMIN = 28, manual = false;
  var root = document.documentElement;
  var ptitle = document.getElementById('ptitle');
  var pbody = document.getElementById('pbody');
  var pagenum = document.getElementById('pagenum');
  var page = document.getElementById('page');
  var SETKEY = 'sermon-teleprompter-v1';

  // 记住用户的字号偏好（手机和 tablet 各记各的）
  try {
    var sv = JSON.parse(localStorage.getItem(SETKEY) || 'null');
    if (sv && sv.fs >= 20 && sv.fs <= 72) { fs = sv.fs; manual = !!sv.manual; }
  } catch (e) {}
  function saveSettings() {
    try { localStorage.setItem(SETKEY, JSON.stringify({ fs: fs, manual: manual, spd: spd })); } catch (e) {}
  }

  // 自动模式：尽量一屏放下，但字不缩到看不清；
  // 小屏实在放不下时，保持可读字号、允许滚动看全
  function fitPage() {
    manual = false;
    page.classList.remove('free');
    page.style.overflowY = 'hidden';
    root.style.setProperty('--fs', fs + 'px');
    var cur = fs;
    var guard = 0;
    while (page.scrollHeight > page.clientHeight + 2 && cur > READMIN && guard < 40) {
      cur -= 2;
      root.style.setProperty('--fs', cur + 'px');
      guard++;
    }
    if (page.scrollHeight > page.clientHeight + 2) {
      page.classList.add('free');
      page.style.overflowY = 'auto';
    }
    saveSettings();
  }
  // 手动调字号：听用户的，不自动缩；字号翻页保持，放太大时允许滚动
  function manualSize() {
    manual = true;
    page.classList.add('free');
    page.style.overflowY = 'auto';
    root.style.setProperty('--fs', fs + 'px');
    saveSettings();
  }

  function render() {
    var p = PAGES[idx];
    ptitle.textContent = p.title;
    pbody.innerHTML = '';
    p.body.forEach(function (t) {
      var el = document.createElement('p');
      if (/章|節/.test(t) && t.length < 80) el.className = 'verse';
      el.textContent = t;
      pbody.appendChild(el);
    });
    pagenum.textContent = (idx + 1) + ' / ' + PAGES.length;
    page.scrollTop = 0;
    if (manual) manualSize(); else fitPage();
  }
  function next() { if (idx < PAGES.length - 1) { idx++; render(); } }
  function prev() { if (idx > 0) { idx--; render(); } }

  document.getElementById('next').addEventListener('click', next);
  document.getElementById('prev').addEventListener('click', prev);
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (scrollOn) {
      /* 滚动模式：右/下/空格/回车 = 暂停·继续；左/上 = 往回滚一屏 */
      if (k === ' ' || k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === 'Enter') {
        togglePause(); e.preventDefault();
      } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') {
        page.scrollTop = Math.max(0, page.scrollTop - page.clientHeight * 0.8);
        e.preventDefault();
      }
      return;
    }
    /* 翻页模式：右/下/空格/回车 = 下一页；左/上 = 上一页 */
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'ArrowDown' || k === 'Enter') {
      next(); e.preventDefault();
    }
    if (k === 'ArrowLeft' || k === 'PageUp' || k === 'ArrowUp') {
      prev(); e.preventDefault();
    }
  });
  document.getElementById('page').addEventListener('click', function (e) {
    if (scrollOn) { togglePause(); return; }
    var w = window.innerWidth;
    if (e.clientX > w * 0.75) next();
    else if (e.clientX < w * 0.25) prev();
  });
  // 横竖屏切换时重算字号（手动模式下保持用户字号）
  // 转屏/尺寸变化：滚动模式下强制重绘一次（防转屏后内容区留白），翻页模式下自动适配字号
  window.addEventListener('resize', function () {
    if (scrollOn) {
      page.style.display = 'none';
      void page.offsetHeight; /* 强制回流重绘 */
      page.style.display = '';
    } else if (!manual) fitPage();
  });

  document.getElementById('bigger').addEventListener('click', function () {
    fs = Math.min(fs + 4, 72);
    if (scrollOn) { root.style.setProperty('--fs', fs + 'px'); saveSettings(); }
    else manualSize();
  });
  document.getElementById('smaller').addEventListener('click', function () {
    fs = Math.max(fs - 4, 20);
    if (scrollOn) { root.style.setProperty('--fs', fs + 'px'); saveSettings(); }
    else manualSize();
  });
  // 回到自动一屏模式（滚动模式下点它会打乱滚动，先忽略）
  document.getElementById('autofit').addEventListener('click', function () {
    if (!scrollOn) fitPage();
  });
  document.getElementById('theme').addEventListener('click', function () {
    document.body.classList.toggle('light');
  });
  document.getElementById('full').addEventListener('click', function () {
    var el = document.documentElement;
    if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
    else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
  });

  // 页内安装按钮：只有 Chrome 判定可安装时才出现，装完自动消失
  (function () {
    var btn = document.getElementById('installBtn');
    var deferredPrompt = null;
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                       window.navigator.standalone === true;
    if (isStandalone) return;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      window.__bipFired = true;
      btn.classList.add('show');
    });
    window.addEventListener('appinstalled', function () {
      btn.classList.remove('show');
      deferredPrompt = null;
    });
    btn.addEventListener('click', function () {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () { deferredPrompt = null; });
      }
    });
  })();

  /* 自动滚动模式：整篇连起来匀速上滚，速度 1~5 可调 */
  var scrollOn = false, paused = false, spd = 2, rafId = null, lastT = 0, savedIdx = 0;
  var SPDS = [0, 10, 14, 20, 28, 40, 56, 80]; /* 每秒像素，1~7 档 */
  var scrollToggle = document.getElementById('scrollToggle');
  var pauseBtn = document.getElementById('pauseBtn');
  var nav = document.getElementById('nav');
  try {
    var sv2 = JSON.parse(localStorage.getItem(SETKEY) || 'null');
    if (sv2 && sv2.spd >= 1 && sv2.spd <= 7) spd = sv2.spd;
  } catch (e2) {}
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function buildScroll() {
    var h = '';
    PAGES.forEach(function (p) {
      h += '<div class="sec-title">' + esc(p.title) + '</div>';
      p.body.forEach(function (t) {
        var cls = (/章|節/.test(t) && t.length < 80) ? ' class="verse"' : '';
        h += '<p' + cls + '>' + esc(t) + '</p>';
      });
    });
    return h;
  }
  function updScrollUI() {
    pagenum.textContent = '速度' + spd + (paused ? '·已暂停' : '');
    pauseBtn.textContent = paused ? '▶继续' : '⏸暂停';
  }
  function setPaused(p) { paused = p; updScrollUI(); }
  function togglePause() { if (scrollOn) setPaused(!paused); }
  function loop(t) {
    if (!scrollOn) return;
    var dt = (t - lastT) / 1000; lastT = t;
    if (!paused) {
      page.scrollTop += SPDS[spd] * dt;
      if (page.scrollTop + page.clientHeight >= page.scrollHeight - 2) setPaused(true);
    }
    rafId = requestAnimationFrame(loop);
  }
  function enterScroll() {
    scrollOn = true; paused = false; savedIdx = idx;
    document.body.classList.add('scrolling');
    page.classList.add('scrollmode');
    page.classList.remove('free');
    page.style.overflowY = 'auto';
    ptitle.textContent = '';
    pbody.innerHTML = buildScroll();
    root.style.setProperty('--fs', fs + 'px');
    nav.style.display = 'none';
    scrollToggle.classList.add('on');
    scrollToggle.textContent = '■退出';
    page.scrollTop = 0;
    updScrollUI();
    cancelAnimationFrame(rafId);
    lastT = performance.now();
    rafId = requestAnimationFrame(loop);
  }
  function exitScroll() {
    scrollOn = false; paused = false;
    cancelAnimationFrame(rafId); rafId = null;
    document.body.classList.remove('scrolling');
    page.classList.remove('scrollmode');
    nav.style.display = '';
    scrollToggle.classList.remove('on');
    scrollToggle.textContent = '▶滚动';
    idx = savedIdx; render();
  }
  scrollToggle.addEventListener('click', function () { scrollOn ? exitScroll() : enterScroll(); });
  pauseBtn.addEventListener('click', function () { togglePause(); });
  document.getElementById('spdDown').addEventListener('click', function () {
    if (spd > 1) { spd--; saveSettings(); if (scrollOn) updScrollUI(); }
  });
  document.getElementById('spdUp').addEventListener('click', function () {
    if (spd < 7) { spd++; saveSettings(); if (scrollOn) updScrollUI(); }
  });

  /* ⟳更新：一键清除本地缓存并重新加载最新版 */
  document.getElementById('forceUpdate').addEventListener('click', function () {
    if (!confirm('要清除本地缓存、重新加载最新版讲章吗？')) return;
    var done = function () { location.reload(); };
    if ('caches' in window) {
      caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }).then(function () {
        if ('serviceWorker' in navigator) {
          return navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.update(); }));
          });
        }
      }).then(done, done);
    } else { done(); }
  });

  render();
})();
</script>
</body>
</html>

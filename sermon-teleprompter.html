<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<title>讲道提词器</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #111; color: #f5f5f5;
         display: flex; flex-direction: column; height: 100vh; height: 100dvh;
         overflow: hidden; user-select: none; }
  body.light { background: #fdfbf5; color: #1a1a1a; }
  #topbar { flex: none; display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; font-size: 15px; opacity: .85; }
  #topbar .grp { display: flex; gap: 8px; align-items: center; }
  #topbar button { font-size: 16px; padding: 8px 14px; border-radius: 10px;
                   border: 1px solid #555; background: transparent; color: inherit;
                   cursor: pointer; }
  body.light #topbar button { border-color: #bbb; }
  #page { flex: 1; display: flex; flex-direction: column; justify-content: center;
          padding: 24px 48px; overflow-y: auto; }
  #ptitle { font-size: calc(var(--fs) * 1.15); font-weight: bold; color: #ffd54a;
            margin-bottom: 28px; line-height: 1.4; }
  body.light #ptitle { color: #8a6d1b; }
  #pbody { font-size: var(--fs); line-height: 1.9; }
  #pbody p { margin: 0 0 22px; }
  #pbody .verse { color: #9fd8c3; }
  body.light #pbody .verse { color: #0d6e5f; }
  #nav { flex: none; display: flex; }
  #nav button { flex: 1; padding: 22px 0; font-size: 22px; border: none;
                background: #1d1d1d; color: #ccc; cursor: pointer; }
  body.light #nav button { background: #eee; color: #555; }
  #nav button:active { background: #2c2c2c; }
  #nav #next { background: #0d3b2e; color: #fff; font-weight: bold; }
  #nav #next:active { background: #147a5b; }
  :root { --fs: 44px; }
</style>
</head>
<body>
  <div id="topbar">
    <div class="grp">
      <button id="smaller">A−</button>
      <button id="bigger">A＋</button>
      <button id="theme">🌙/☀️</button>
    </div>
    <div id="pagenum">1 / 1</div>
  </div>

  <div id="page">
    <div id="ptitle"></div>
    <div id="pbody"></div>
  </div>

  <div id="nav">
    <button id="prev">◀ 上一页</button>
    <button id="next">下一页 ▶</button>
  </div>

<script>
(function () {
  // ===== 讲章内容：一页一个对象，title 为标题，body 为段落数组 =====
  // 收到正式讲章后替换此处
  var PAGES = [
    { title: "示例页：认识圣灵（三）",
      body: ["这是示例内容。", "正式讲章发来后，这里换成你的讲道提纲。", "每页一个要点，字够大，站在讲台上看得清。"] },
    { title: "翻页方法",
      body: ["点「下一页」往后翻，点「上一页」往回翻。", "也可以用键盘 ← → 键，或蓝牙翻页器。", "右上角 A＋/A− 调字号，🌙/☀️ 切换深浅色。"] },
    { title: "讲道时的小技巧",
      body: ["一页只讲一个要点，讲完再翻。", "经文用青色标出，提醒自己慢读。", "翻页前停顿一下，给会众消化时间。"] }
  ];

  var idx = 0, fs = 44;
  var root = document.documentElement;
  var ptitle = document.getElementById('ptitle');
  var pbody = document.getElementById('pbody');
  var pagenum = document.getElementById('pagenum');

  function render() {
    var p = PAGES[idx];
    ptitle.textContent = p.title;
    pbody.innerHTML = '';
    p.body.forEach(function (t) {
      var el = document.createElement('p');
      // 经文引用标色：含"："且像经文的段落
      if (/^[（(]/.test(t) || /章|節|节/.test(t) && t.length < 60) el.className = 'verse';
      el.textContent = t;
      pbody.appendChild(el);
    });
    pagenum.textContent = (idx + 1) + ' / ' + PAGES.length;
    document.getElementById('page').scrollTop = 0;
  }
  function next() { if (idx < PAGES.length - 1) { idx++; render(); } }
  function prev() { if (idx > 0) { idx--; render(); } }

  document.getElementById('next').addEventListener('click', next);
  document.getElementById('prev').addEventListener('click', prev);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ') next();
    if (e.key === 'ArrowLeft') prev();
  });
  // 点击页面左右边缘翻页（避开顶部工具栏）
  document.getElementById('page').addEventListener('click', function (e) {
    var w = window.innerWidth;
    if (e.clientX > w * 0.75) next();
    else if (e.clientX < w * 0.25) prev();
  });

  document.getElementById('bigger').addEventListener('click', function () {
    fs = Math.min(fs + 6, 96); root.style.setProperty('--fs', fs + 'px');
  });
  document.getElementById('smaller').addEventListener('click', function () {
    fs = Math.max(fs - 6, 24); root.style.setProperty('--fs', fs + 'px');
  });
  document.getElementById('theme').addEventListener('click', function () {
    document.body.classList.toggle('light');
  });

  render();
})();
</script>
</body>
</html>
